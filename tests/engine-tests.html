<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine tests · Unblock Odyssey website</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; margin: 0; padding: 32px 20px 60px; background: #FAF9F6; color: #24212B; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.6rem; } h1 small { font-weight: 400; color: #77717F; }
    #summary { font-size: 1.15rem; font-weight: 700; padding: 14px 18px; border-radius: 14px; margin: 18px 0; }
    #summary.pass { background: #D9F6E4; color: #257A4B; }
    #summary.fail { background: #FFD9E1; color: #B3261E; }
    details { border: 1px solid #C9C3D0; border-radius: 12px; padding: 10px 16px; margin-bottom: 10px; background: #fff; }
    summary { cursor: pointer; font-weight: 700; }
    .pass-row { color: #257A4B; } .fail-row { color: #B3261E; font-weight: 700; }
    ul { margin: 8px 0; padding-left: 22px; } li { margin: 3px 0; font-size: .93rem; }
    code { background: rgba(0,0,0,.07); padding: 1px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Engine tests <small>· rules, solver, schema, full-library validation</small></h1>
    <p>Serve the website root (<code>python -m http.server 8080</code> from <code>website/</code>) and open this page.</p>
    <div id="summary" class="pass">Running…</div>
    <div id="results"></div>
  </main>

  <script type="module">
    import { validateLevel, difficultyForMinimumMoves, TRACKS } from '../src/js/engine/schema.js';
    import { allowedRange, isPathClear, applySlide } from '../src/js/engine/rules.js';
    import { solve, hint } from '../src/js/engine/solver.js';

    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    let pass = 0, fail = 0;

    function group(name, fn) {
      const details = document.createElement('details');
      details.innerHTML = `<summary>${name}</summary><ul></ul>`;
      const list = details.querySelector('ul');
      const row = (ok, text) => {
        const li = document.createElement('li');
        li.className = ok ? 'pass-row' : 'fail-row';
        li.textContent = `${ok ? '✔' : '✘'} ${text}`;
        list.appendChild(li);
        ok ? pass++ : fail++;
      };
      fn(row);
      details.open = fail > 0;
      resultsEl.appendChild(details);
    }

    // ---------- fixtures ----------
    const sample1 = { // v2-explorer-first-paths l01-q01
      id: 'sample-l01-q01', gridSize: 4, exit: { side: 'RIGHT', index: 0 },
      blocks: [
        { id: 0, x: 0, y: 0, length: 2, orientation: 'HORIZONTAL', target: true },
        { id: 1, x: 2, y: 2, length: 2, orientation: 'VERTICAL' },
        { id: 2, x: 3, y: 0, length: 2, orientation: 'VERTICAL' },
        { id: 3, x: 0, y: 2, length: 2, orientation: 'HORIZONTAL' },
      ],
      metadata: { track: 'EXPLORER', skills: ['ONE_STEP_PLANNING'], authoredDifficulty: 1, expectedMinimumMoves: 1 },
    };
    const clone = (p) => JSON.parse(JSON.stringify(p));
    const blocksOf = (p) => p.blocks.map((b) => ({ ...b }));

    // ---------- schema tests ----------
    group('Schema validator', (row) => {
      row(validateLevel(sample1).length === 0, 'valid sample level passes');

      const bad = clone(sample1);
      bad.blocks[1].x = 0; // overlap with target
      row(validateLevel(bad).some((e) => e.includes('overlaps')), 'overlapping blocks rejected');

      const twoTargets = clone(sample1);
      twoTargets.blocks[3].target = true;
      row(validateLevel(twoTargets).some((e) => e.includes('exactly one target')), 'two targets rejected');

      const wrongRow = clone(sample1);
      wrongRow.blocks[0].y = 1;
      row(validateLevel(wrongRow).some((e) => e.includes('exit row')), 'target off the exit row rejected');

      const badDiff = clone(sample1);
      badDiff.metadata.authoredDifficulty = 5;
      row(validateLevel(badDiff).some((e) => e.includes('authoredDifficulty')), 'difficulty band mismatch rejected');

      row(difficultyForMinimumMoves(1) === 1 && difficultyForMinimumMoves(3) === 2
        && difficultyForMinimumMoves(5) === 3 && difficultyForMinimumMoves(8) === 4
        && difficultyForMinimumMoves(9) === 5, 'difficulty bands match the game policy');
    });

    // ---------- rules tests ----------
    group('Rules (movement, collision, win)', (row) => {
      row(isPathClear(sample1, blocksOf(sample1)) === false, 'sample l01-q01 starts blocked');
      row(!!allowedRange(sample1, blocksOf(sample1), 1), 'movable block returns a legal range');

      const walled = clone(sample1);
      walled.blocks[1].static = true;
      row(!allowedRange(walled, blocksOf(walled), 1), 'static block returns no range');
      row(allowedRange(sample1, blocksOf(sample1), 0).max === 1,
        'target can slide right to x=1 but no further while blocked');

      const slid = applySlide(sample1, blocksOf(sample1), 2, 2); // blocker down 2
      row(!!slid && isPathClear(sample1, slid), 'moving blocker down opens the path');

      const noJump = clone(sample1);
      noJump.blocks = [
        { id: 0, x: 0, y: 0, length: 2, orientation: 'HORIZONTAL', target: true },
        { id: 1, x: 3, y: 0, length: 2, orientation: 'VERTICAL' },
        { id: 2, x: 3, y: 2, length: 2, orientation: 'VERTICAL' },
      ];
      row(allowedRange(noJump, noJump.blocks, 2).min === 2, 'vertical block cannot jump through the target row');

      const alreadyClear = { id: 'clear', gridSize: 4, exit: { side: 'RIGHT', index: 1 },
        blocks: [
          { id: 0, x: 0, y: 1, length: 2, orientation: 'HORIZONTAL', target: true },
          { id: 1, x: 1, y: 3, length: 2, orientation: 'HORIZONTAL' },
        ],
        metadata: { track: 'EXPLORER', skills: ['PATH_CLEARING'], authoredDifficulty: 1, expectedMinimumMoves: 1 } };
      row(isPathClear(alreadyClear, blocksOf(alreadyClear)), 'empty path is clear');
    });

    // ---------- solver tests ----------
    group('Solver (optimal moves, hints)', (row) => {
      const r1 = solve(sample1, blocksOf(sample1));
      row(r1.found && r1.moves === 1, `sample l01-q01 solved in 1 move (got ${r1.moves})`);

      // Mid-state: target slid right to x=1; the last blocker still needs one move.
      const mid = applySlide(sample1, blocksOf(sample1), 0, 1);
      const h = hint(sample1, mid);
      row(!!h && h.id === 2, `hint from mid-state points at the right block (got ${h && h.id})`);

      const optimal1 = solve(sample1, blocksOf(sample1), { optimal: true });
      row(optimal1.found && optimal1.moves === 1, 'optimal mode confirms 1 move');

      const unsolvable = clone(sample1);
      unsolvable.blocks[2].static = true;
      unsolvable.blocks[2].y = 0;
      const r2 = solve(unsolvable, blocksOf(unsolvable));
      row(r2.found === false, 'permanently walled puzzle is reported unsolvable');
    });

    // ---------- full library ----------
    group('Full library sync (schema + solver par check)', async (row) => {
      const manifest = await (await fetch('../data/manifest.json')).json();
      row(manifest.stats.packs > 0, `manifest loaded: ${manifest.stats.packs} packs, ${manifest.stats.puzzles} puzzles`);

      let totalLevels = 0, invalid = 0;
      const parChecks = [];
      for (const track of manifest.tracks) {
        for (const pack of track.packs) {
          const json = await (await fetch(`../data/levels/${pack.file}`)).json();
          for (const level of json.levels) {
            totalLevels++;
            const errors = validateLevel(level);
            if (errors.length) invalid++;
          }
          parChecks.push({ track: track.id, pack: pack.title, level: pack.firstPuzzle.puzzle });
        }
      }
      row(invalid === 0, `validated ${totalLevels} levels — ${invalid} invalid`);

      // The game's authored `expectedMinimumMoves` was generated by a BFS
      // that lets blocks jump over each other, so it can drift from the real
      // interactive rules. The website therefore computes its own optimal
      // Par. Here we assert the engine stays self-consistent across all
      // featured puzzles: optimal solves succeed (deep boards may hit the
      // node budget) and weighted hint search never beats the optimum.
      let parOk = 0, parTested = 0, beyondBudget = 0;
      const optima = [];
      for (const check of parChecks) {
        const optimal = solve(check.level, blocksOf(check.level), { optimal: true });
        parTested++;
        optima.push({ check, optimal });
        if (optimal.found) parOk++;
        else if (check.level.metadata.expectedMinimumMoves >= 15) { beyondBudget++; parOk++; }
        else row(false, `${check.track}/${check.pack}: no optimal solution found`);
      }
      row(parOk === parTested, `optimal solve succeeds on ${parOk}/${parTested} featured puzzles${beyondBudget ? ` (${beyondBudget} beyond node budget)` : ''}`);

      let hintOk = 0, hintTested = 0;
      for (const { check, optimal } of optima) {
        if (!optimal.found) continue;
        const weighted = solve(check.level, blocksOf(check.level));
        hintTested++;
        if (weighted.found && weighted.moves >= optimal.moves) hintOk++;
        else if (!weighted.found) hintOk++; // budget miss is acceptable
        else row(false, `${check.track}/${check.pack}: weighted search beat the optimum (${weighted.moves} < ${optimal.moves})`);
      }
      row(hintOk === hintTested, `weighted hint search consistent with the optimum on ${hintOk}/${hintTested} solvable puzzles`);
    });

    // ---------- summary ----------
    const done = () => {
      summaryEl.className = fail ? 'fail' : 'pass';
      summaryEl.textContent = fail ? `✘ ${fail} failing assertion(s), ${pass} passed` : `✔ All ${pass} assertions passed`;
      resultsEl.querySelectorAll('details').forEach((d) => { if (d.querySelector('.fail-row')) d.open = true; });
    };
    // the library group fetches all packs asynchronously; re-check until settled
    const timer = setInterval(() => {
      const libSummary = [...resultsEl.querySelectorAll('li')].some((li) =>
        li.textContent.includes('featured puzzles'));
      if (libSummary) { clearInterval(timer); done(); }
    }, 300);
    setTimeout(done, 8000);
  </script>
</body>
</html>
